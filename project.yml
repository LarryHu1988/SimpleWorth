name: SimpleWorth
options:
  minimumXcodeGenVersion: 2.37.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  SimpleWorth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    entitlements:
      path: Sources/SimpleWorth.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.larry.SimpleWorth
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.larry.SimpleWorth
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.larry.SimpleWorth"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 简值
        CFBundleShortVersionString: 0.6.4
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.larry.SimpleWorth
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Sources/Preview Content"'

schemes:
  SimpleWorth:
    build:
      targets:
        SimpleWorth: all
    run:
      config: Debug
