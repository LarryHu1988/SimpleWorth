name: SimpleWorth
options:
  minimumXcodeGenVersion: 2.37.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.8.0
    CURRENT_PROJECT_VERSION: "33"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  SimpleWorth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    entitlements:
      path: Sources/SimpleWorth.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.larry.SimpleWorth
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.larry.SimpleWorth
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.larry.SimpleWorth"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 简值
        CFBundleShortVersionString: 0.8.0
        CFBundleVersion: "33"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.larry.SimpleWorth
        DEVELOPMENT_TEAM: 2S7X36GQC9
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Sources/Preview Content"'

schemes:
  SimpleWorth:
    build:
      targets:
        SimpleWorth: all
    run:
      config: Debug
