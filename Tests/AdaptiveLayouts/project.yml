name: AdaptiveLayoutCheck
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGNING_ALLOWED: NO
targets:
  AdaptiveLayoutCheck:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist, SimpleWorth.entitlements]
      - Fixture.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleworth.qa.adaptivelayouts
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LayoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LayoutTests.swift]
    dependencies:
      - target: AdaptiveLayoutCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleworth.qa.adaptivelayouts.models
        GENERATE_INFOPLIST_FILE: YES
  ResizeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ResizeTests.swift, NativeDeviceTests.swift, WorkspaceTests.swift, LiveTransitionTests.swift, ScrollingTests.swift]
    dependencies:
      - target: AdaptiveLayoutCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleworth.qa.adaptivelayouts.ui
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AdaptiveLayoutCheck:
    build:
      targets:
        AdaptiveLayoutCheck: all
    test:
      targets: [LayoutTests, ResizeTests]
