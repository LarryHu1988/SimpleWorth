name: FixedHeaderCheck
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGNING_ALLOWED: NO
targets:
  FixedHeaderCheck:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist, SimpleWorth.entitlements]
      - Fixture.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleworth.qa.fixedheaders
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HeaderTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HeaderTests.swift]
    dependencies:
      - target: FixedHeaderCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleworth.qa.fixedheaders.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FixedHeaderCheck:
    build:
      targets:
        FixedHeaderCheck: all
    test:
      targets: [HeaderTests]
