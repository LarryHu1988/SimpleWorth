<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>SimpleWorth GitHub social preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; }
    body { background: #eff6ff; color: #1b3043; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; letter-spacing: 0; }
    main { width: 100%; height: 100%; display: grid; grid-template-columns: 248px 1fr; align-items: center; gap: 64px; padding: 72px 92px; }
    .icon { display: block; width: 248px; height: 248px; border-radius: 52px; box-shadow: 0 20px 40px #547b991a; }
    .brand { margin: 0 0 20px; font-size: 58px; font-weight: 650; line-height: 1.2; white-space: nowrap; }
    .brand span { margin-left: 16px; font-size: 34px; font-weight: 500; color: #4e7288; }
    .slogan { margin: 0; font-size: 40px; font-weight: 550; line-height: 1.35; color: #3f7974; }
    .translation { margin: 12px 0 0; font-size: 29px; line-height: 1.4; color: #557d9c; }
    .devices { margin: 34px 0 0; font-size: 23px; line-height: 1.5; color: #4c6173; }
    .principles { margin: 7px 0 0; font-size: 21px; line-height: 1.5; color: #5d7183; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="../../Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" alt="SimpleWorth App icon" width="248" height="248">
    <section>
      <h1 class="brand">SimpleWorth<span>简值</span></h1>
      <p class="slogan">记得简单，心里有数。</p>
      <p class="translation">Less clutter. More clarity.</p>
      <p class="devices">iPhone · iPad · Duo</p>
      <p class="principles">Free · No ads · Local first</p>
    </section>
  </main>
</body>
</html>
